<!doctype html>
<!-- Spike page: does Excalidraw run with no build step? Not part of the board UI. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excalidraw spike</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
  #root { position: absolute; inset: 0; }
  #verdict {
    position: fixed; left: 8px; bottom: 8px; z-index: 9; padding: 6px 10px;
    border-radius: 6px; background: #111; color: #eee; font: 12px ui-monospace, monospace;
    max-width: calc(100vw - 16px); white-space: pre-wrap;
  }
</style>
<div id="root"></div>
<div id="verdict">booting…</div>

<script>
  // Where the lazy-loaded fonts live. Must be set before the bundle initialises.
  window.EXCALIDRAW_ASSET_PATH = '/ui/vendor/excalidraw/';

  // The spike's whole point: does it throw? Surface anything the console would
  // eat, on the page, so the captain can see it from a phone.
  const errs = [];
  const show = () => {
    document.getElementById('verdict').textContent = errs.length
      ? 'ERRORS (' + errs.length + '):\n' + errs.join('\n')
      : 'no errors — draw a box, drag it, resize it';
  };
  window.addEventListener('error', (e) => { errs.push(String(e.message)); show(); });
  window.addEventListener('unhandledrejection', (e) => { errs.push('promise: ' + e.reason); show(); });
</script>

<script src="/ui/vendor/react.production.min.js"></script>
<script src="/ui/vendor/react-dom.production.min.js"></script>
<script src="/ui/vendor/excalidraw/excalidraw.production.min.js"></script>

<script>
  // No JSX without a build step, so createElement by hand. That is the entire
  // adaptation cost of a React component in this codebase.
  const el = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    el(ExcalidrawLib.Excalidraw, {
      theme: 'dark',
      UIOptions: { canvasActions: { loadScene: false } },
      // Parked on window so the scene can be inspected from the console — the
      // same handle a real integration would use to read/write elements.
      excalidrawAPI: (api) => { window.api = api; },
    })
  );
  setTimeout(show, 1500);
</script>
